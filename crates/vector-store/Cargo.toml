[package]
name = "ai-agent-workspace-vector-store"
version = "0.1.0"
edition = "2021"

[dependencies]
fastembed = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
